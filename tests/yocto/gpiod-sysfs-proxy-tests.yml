header:
  version: 14

machine: qemux86-64
distro: poky

target: core-image-minimal

# Pinned to a Yocto Project release rather than tracking master. Besides the
# obvious reproducibility, this is what makes SSTATE_MIRRORS useful: the
# autobuilder built exactly this metadata and published the resulting shared
# state, so most of a from-scratch build is a download rather than a compile.
# An arbitrary master commit matches nothing on the mirror.
#
# To move to a newer release, bump all three yocto-* tags together and update
# the meta-openembedded branch to the matching codename, then regenerate the
# lockfile with `kas lock --update` (see README.md).
repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0.2
    path: bitbake
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0.2
    path: openembedded-core
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    tag: yocto-6.0.2
    path: meta-yocto
    layers:
      meta-poky:

  # meta-openembedded is community maintained and publishes no yocto-* tags,
  # so it can only be tracked by its release branch. The lockfile is what
  # actually pins it to a commit.
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    path: meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  # TODO: See if we can add the source here rather than mounting via 9pfs ?
  gpiod-sysfs-proxy:
    path: .
    layers:
      tests/yocto:

local_conf_header:
  features: |
    EXTRA_IMAGE_FEATURES = "allow-empty-password empty-root-password allow-root-login"
    EXTRA_IMAGE_FEATURES += "ptest-pkgs"

    DISTRO_FEATURES = "ipv4 xattr zeroconf ldconfig"
    DISTRO_FEATURES:append = " ptest"

    INIT_MANAGER = "systemd"

  kernel: |
    # Deliberately no features/gpio/sysfs.scc: that enables CONFIG_GPIO_SYSFS,
    # which is the interface the proxy exists to replace. With it on, the
    # kernel provides /sys/class/gpio itself, the two mount units ship a
    # ConditionPathExists=!/sys/class/gpio and skip, and the ptest suite passes
    # against the kernel without ever reaching the code under test.
    KERNEL_FEATURES:append = " \
        features/gpio/sim.scc \
        features/gpio/mockup.scc \
        features/overlayfs/overlayfs.scc \
    "

  packages: |
    IMAGE_INSTALL:append = " \
        kernel-module-gpio-sim \
        kernel-module-gpio-mockup \
        kernel-module-configfs \
    "

    IMAGE_INSTALL:append = " libgpiod libgpiodcxx libgpiod-tools"
    #IMAGE_INSTALL:append = " libgpiod-cli"

    #PACKAGECONFIG:append:pn-libgpiod = " glib"
    #PACKAGECONFIG:append:pn-libgpiod = " dbus"

    #IMAGE_INSTALL:append = " python3-gpiod"

    # The recipe comes from meta-openembedded and would build the release on
    # PyPI; tests/yocto/recipes-support/gpiod-sysfs-proxy/*.bbappend points it
    # at this checkout instead.
    IMAGE_INSTALL:append = " gpiod-sysfs-proxy"
    PACKAGECONFIG:append:pn-gpiod-sysfs-proxy = " sys-class-mount"

    IMAGE_INSTALL:append = " ptest-runner"

    IMAGE_FEATURES += "ssh-server-openssh"

  image: |
    # Uncompressed, and only what runqemu needs. Recent oe-core defaults the
    # qemu machines to a zstd-compressed rootfs, which runqemu refuses to boot
    # unless it is given "snapshot" (it will not decompress an image it may
    # write to). Booting the ext4 in place also avoids keeping a second,
    # decompressed copy of the rootfs on a disk-constrained CI runner.
    IMAGE_FSTYPES = "ext4"

  qemu-virtfs: |
    PACKAGECONFIG:append:pn-qemu-system-native = " virtfs"

  build: |
    # Kept outside the build directory so they survive a wipe of it, and so
    # they can be cached independently. CI relies on these exact locations,
    # see the DL_DIR/SSTATE_DIR variables in .github/workflows/ci.yml.
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
