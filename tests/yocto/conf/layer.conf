BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "gpiod-sysfs-proxy-tests"
BBFILE_PATTERN_gpiod-sysfs-proxy-tests = "^${LAYERDIR}/"
BBFILE_PRIORITY_gpiod-sysfs-proxy-tests = "6"

# TODO: Fixup
LAYERSERIES_COMPAT_gpiod-sysfs-proxy-tests = "wrynose master"

# Absolute path to the checked out source tree. This layer sits at
# <checkout>/tests/yocto, so the tree is two directories up. Resolved with :=
# because LAYERDIR only exists while this file is being parsed.
# The gpiod-sysfs-proxy bbappend builds this tree in place of the release the
# recipe would otherwise fetch from PyPI.
GPIOD_SYSFS_PROXY_SRC := "${@os.path.normpath(d.getVar('LAYERDIR') + '/../..')}"
