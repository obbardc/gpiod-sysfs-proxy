# TODO: Write a bit about what this CI does.
# TODO: Check if we actually run the checked out code 

name: CI

on:
  push:
    #branches: [main]
  pull_request:
    #branches: [main]
  # Keep the cache on the default branch warm. GitHub evicts cache entries
  # that have not been read for 7 days, and only the default branch's caches
  # are visible to pull requests from other branches.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installed from PyPI rather than via fsfe/reuse-action so that this is
      # exactly the command a developer runs locally.
      - name: Install reuse
        run: pip3 install reuse

      - name: Check REUSE compliance
        run: reuse lint

  ptest:
    runs-on: ubuntu-22.04
    # Serialise builds per branch: two concurrent Yocto builds would race to
    # write the same cache entries. A build already running for an older
    # commit is left to finish rather than cancelled, so that it still gets to
    # save its sstate (see the incremental build notes in README.md). This is
    # scoped to the job so that the quick licensing check above is never stuck
    # behind a multi-hour build.
    concurrency:
      group: ci-ptest-${{ github.ref }}
      cancel-in-progress: false
    # GitHub kills the runner at 6 hours with no chance to save anything, so
    # the job must never get that far. BUILD_TIMEOUT_MINUTES below stops
    # bitbake early enough to leave room for the cache steps.
    timeout-minutes: 360

    env:
      KAS_CONFIG: tests/yocto/gpiod-sysfs-proxy-tests.yml:tests/yocto/ci.yml
      # kas puts the build directory here, and the kas config derives DL_DIR
      # and SSTATE_DIR from it as ${TOPDIR}/../{downloads,sstate-cache}.
      KAS_BUILD_DIR: ${{ github.workspace }}/build
      DL_DIR: ${{ github.workspace }}/downloads
      SSTATE_DIR: ${{ github.workspace }}/sstate-cache
      # Wall-clock budget for bitbake. The remaining ~90 minutes of the job
      # limit covers host setup, pruning and uploading several GB of cache,
      # and the QEMU run.
      BUILD_TIMEOUT_MINUTES: 270
      # The whole repository shares 10 GB of cache, and both entries below are
      # re-uploaded every run, so leave headroom for one generation of each.
      SSTATE_BUDGET_MB: 5000
      DL_BUDGET_MB: 2500

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Remove large pre-installed packages that are unused in a Yocto build.
      # This reclaims ~15 GB, bringing total available space to ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' \
            'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-cloud-cli \
            google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri \
            --fix-broken 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping python3-git python3-jinja2 \
            libegl1-mesa libsdl1.2-dev python3-subunit mesa-common-dev \
            zstd liblz4-tool file locales libacl1 sshpass
          sudo locale-gen en_US.UTF-8

      # GitHub's Linux runners expose /dev/kvm, but as root:kvm 0660, and the
      # runner user's group membership is not picked up by the already-running
      # job. The udev rule relaxes the mode so runqemu can use hardware
      # acceleration; without it the guest falls back to TCG and boots an
      # order of magnitude slower. Non-fatal: a runner without /dev/kvm at all
      # still works, just slowly.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Install kas
        run: pip3 install kas

      # The restore keys are deliberately loose: sstate objects are content
      # addressed and carry their own signatures, so a stale entry can only
      # ever be ignored by bitbake, never used incorrectly. Restoring the most
      # recent cache from any commit is therefore strictly better than
      # restoring nothing.
      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DL_DIR }}
          key: yocto-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yocto-downloads-

      - name: Restore sstate cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SSTATE_DIR }}
          key: yocto-sstate-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yocto-sstate-${{ runner.arch }}-

      - name: Build image
        id: build
        run: |
          set -o pipefail

          # Cap bitbake's wall-clock time rather than letting the job hit the
          # 6 hour limit, where the runner is destroyed and the sstate built so
          # far is lost. SIGTERM lets bitbake wind down its running tasks;
          # every task that has already completed has written its sstate object
          # by then, so the next run picks up where this one stopped.
          # SIGKILL follows if bitbake does not exit within the grace period.
          set +e
          timeout --signal=TERM --kill-after=10m "${BUILD_TIMEOUT_MINUTES}m" \
            kas build "${KAS_CONFIG}"
          rc=$?
          set -e

          case "${rc}" in
            0)
              echo "complete=true" >> "$GITHUB_OUTPUT"
              ;;
            124|137)
              echo "complete=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Build did not finish::bitbake was stopped" \
                   "after ${BUILD_TIMEOUT_MINUTES} minutes. The sstate built so" \
                   "far is being saved; re-run this job to continue."
              ;;
            *)
              exit "${rc}"
              ;;
          esac

          df -h

      # TODO: Yocto's own testimage class does all of this: boot, SSH readiness,
      # ptest-runner, result collection, log capture...
      # (TEST_SUITES = "ping ssh ptest", bitbake core-image-minimal -c testimage)
      - name: Run ptests in QEMU
        if: steps.build.outputs.complete == 'true'
        timeout-minutes: 30
        run: |
          # kas checks out each repo of the config next to the project
          # directory, so oe-core (and the bitbake it locates as ../bitbake)
          # are both under the kas work dir, which defaults to
          # $GITHUB_WORKSPACE. Re-initialising an existing build directory
          # keeps the conf/ that kas generated.
          source "${GITHUB_WORKSPACE}/openembedded-core/oe-init-build-env" \
            "${KAS_BUILD_DIR}"

          CONSOLE_LOG="${GITHUB_WORKSPACE}/qemu-console.log"

          # runqemu does not reliably take its qemu child down with it, and
          # $! is the runqemu wrapper rather than qemu itself, so sweep up by
          # name as well. The runner is thrown away afterwards, so there is no
          # other qemu process that could be caught by this.
          cleanup() {
            kill "${QEMU_PID}" 2>/dev/null || true
            pkill -f qemu-system-x86_64 2>/dev/null || true
          }
          trap cleanup EXIT

          # KVM is not available on every runner image; fall back to TCG,
          # which boots this image in a few minutes rather than seconds.
          ACCEL=""
          if [ -w /dev/kvm ]; then
            ACCEL="kvm"
          else
            echo "::notice title=No KVM::/dev/kvm is unavailable, emulating."
          fi

          # Start QEMU with slirp (user-mode) networking; no root or tap device
          # needed. runqemu maps host:2222 -> guest:22 by default under slirp.
          # nographic puts the console on ttyS0, which is captured to a log and
          # uploaded, since a boot failure is otherwise invisible from here.
          # The fstype is named explicitly rather than left to runqemu's
          # search of the deploy directory; see IMAGE_FSTYPES in
          # tests/yocto/gpiod-sysfs-proxy-tests.yml.
          # stdin is closed so runqemu never blocks trying to read the console.
          runqemu qemux86-64 core-image-minimal ext4 nographic slirp ${ACCEL} \
            < /dev/null > "${CONSOLE_LOG}" 2>&1 &
          QEMU_PID=$!

          # Wait up to 10 minutes for SSH to become available. That is far
          # longer than a KVM boot needs, but without acceleration the guest
          # takes several minutes to reach a login prompt, and the step's own
          # timeout is the real backstop.
          READY=0
          for i in $(seq 1 120); do
            # If runqemu has already exited then the guest is never coming up;
            # fail now instead of burning the rest of the timeout.
            if ! kill -0 "${QEMU_PID}" 2>/dev/null; then
              echo "runqemu exited before the guest became reachable" >&2
              break
            fi
            if sshpass -p "" ssh \
                -p 2222 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 \
                -o PasswordAuthentication=yes \
                -o PreferredAuthentications=password \
                root@localhost true 2>/dev/null; then
              READY=1
              break
            fi
            sleep 5
          done

          if [ "${READY}" -ne 1 ]; then
            echo "Timed out waiting for QEMU to boot; console output follows" >&2
            cat "${CONSOLE_LOG}" >&2 || true
            exit 1
          fi

          sshpass -p "" ssh \
            -p 2222 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PasswordAuthentication=yes \
            -o PreferredAuthentications=password \
            root@localhost \
            ptest-runner gpiod-sysfs-proxy \
            | tee "${GITHUB_WORKSPACE}/ptest-results.txt"
          exit "${PIPESTATUS[0]}"

      - name: Upload ptest results
        if: always() && steps.build.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ptest-results
          path: |
            ptest-results.txt
            qemu-console.log
          if-no-files-found: warn

      # Everything below runs even when the build was cut short: saving a
      # partial cache is the entire point of stopping early.
      - name: Prune caches to their budgets
        if: always()
        run: |
          # Drop sstate objects that have been superseded by a newer signature
          # of the same task, then fall back to trimming by age.
          MGMT="${GITHUB_WORKSPACE}/openembedded-core/scripts/sstate-cache-management.py"
          if [ -f "${MGMT}" ]; then
            python3 "${MGMT}" --cache-dir="${SSTATE_DIR}" \
              --remove-duplicated --yes || true
          fi

          python3 .github/scripts/prune-cache.py "${SSTATE_DIR}" \
            --budget-mb "${SSTATE_BUDGET_MB}"
          python3 .github/scripts/prune-cache.py "${DL_DIR}" \
            --budget-mb "${DL_BUDGET_MB}"

      # The save keys embed run_id and run_attempt so that re-running a job to
      # continue an unfinished build always writes a new entry instead of
      # colliding with the one it restored from.
      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DL_DIR }}
          key: yocto-downloads-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SSTATE_DIR }}
          key: yocto-sstate-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if the build did not finish
        if: always() && steps.build.outputs.complete == 'false'
        run: |
          echo "The build was stopped after ${BUILD_TIMEOUT_MINUTES} minutes" \
               "so that its sstate cache could be saved." >&2
          echo "Re-run this job; it will restore that cache and carry on." >&2
          exit 1
