name: Update Yocto lockfile

# The layers in tests/yocto/gpiod-sysfs-proxy-tests.yml are pinned, so nothing
# moves underneath us on its own. This job proposes the move instead: it
# refreshes the lockfile on a schedule and opens a pull request, so that an
# upstream regression shows up as a failing update PR rather than as a red CI
# run on somebody's unrelated change.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAS_CONFIG: tests/yocto/gpiod-sysfs-proxy-tests.yml
      LOCKFILE: tests/yocto/gpiod-sysfs-proxy-tests.lock.yml
      BRANCH: ci/update-yocto-lockfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kas
        run: pip3 install kas

      - name: Refresh lockfile
        id: lock
        # Clone the layers outside the working tree so that they do not show
        # up as untracked files in the diff below.
        env:
          KAS_WORK_DIR: ${{ runner.temp }}/kas
        run: |
          mkdir -p "${KAS_WORK_DIR}"
          kas lock --update "${KAS_CONFIG}"

          if git diff --quiet -- "${LOCKFILE}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- "${LOCKFILE}"
          fi

      - name: Open or update pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -B "${BRANCH}"
          git add "${LOCKFILE}"
          git commit -m 'tests: yocto: update lockfile' \
                     -m 'Refreshed by the update-lockfile workflow.'
          git push --force origin "${BRANCH}"

          # Reuse the open pull request if there is one; force-pushing the
          # branch has already updated it.
          if [ -z "$(gh pr list --head "${BRANCH}" --state open \
                       --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "${BRANCH}" \
              --base "${{ github.event.repository.default_branch }}" \
              --title 'tests: yocto: update lockfile' \
              --body 'Automated refresh of the kas lockfile. Merging moves
          the pinned layer revisions forward; check that CI passes first.

          Note that pull requests opened by `GITHUB_TOKEN` do not trigger
          workflow runs. Close and reopen this pull request, or push to its
          branch, to get a CI run.'
          fi
